name: St. Bernard Software
description: 'St. Bernard Software was a San Diego-based web-security company (iPrism
  web-filtering appliances) that rebranded to EdgeWave and whose technology and domains now
  resolve to the successor cybersecurity provider GoSecure (gosecure.ai / gosecure.net). The
  St. Bernard Software brand is defunct: an enrichment pass on 2026-07-21 confirmed stbernard.com
  presents a *.gosecure.net certificate and edgewave.com 301-redirects to gosecure.ai. The
  successor company GoSecure offers 24/7 managed detection and response services and publishes
  no developer portal or public API. This company therefore has no independent, live API surface
  to enrich, and no API artifacts were created (attributing GoSecure''s surface to this legacy
  slug would conflate two distinct companies).'
